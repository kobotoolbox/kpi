name: Python linter (Darker)

on: workflow_call
jobs:
  darker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # In addition to checking out the 'merge commit', we also want to
          # fetch enough commits to find the most recent commit in the base
          # branch (typically 'main')
          fetch-depth: 100

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with: { enable-cache: 'false' }

      - name: Install pip dependencies
        run: uv pip install --system darker[isort]==2.1.1 flake8 flake8-quotes isort --quiet

      - name: Run Darker, comparing '${{github.ref_name}}' with the latest in '${{github.event.pull_request.base.ref}}'
        run: |
          # Run darker only on file changes introduced in this PR.
          # Allows incremental adoption of linter rules on a per-file basis.

          # Prevents this scenario:
          #  - PR A is opened, modifying file A; CI passes.
          #  - PR B is opened & merged, with linter errors in file B.
          #  - PR A is updated again, modifying file A. CI fails from file B.
          # Get the latest commit in the base branch (usually 'main') at time of
          # CI run, to compare with this PR's merge branch.
          # GitHub doesn't provide a nice name for this SHA, but we can find it:
          # https://www.kenmuse.com/blog/the-many-shas-of-a-github-pull-request/#extracting-the-base-sha
          MERGE_PARENTS=($(git rev-list --parents -1 ${{ github.sha }}))
          LATEST_IN_BASE_BRANCH=${MERGE_PARENTS[1]}

          if [[ -z "$LATEST_IN_BASE_BRANCH" ]]; then
            echo "::error::Could not resolve the base-branch SHA from ${{ github.sha }}."
            exit 1
          fi

          # Run darker. (https://github.com/akaihola/darker)
          # -L runs the linter
          #  `--ignore=F821` avoids raising false positive error in typing
          #   annotations with string, e.g. def my_method(my_model: 'ModelName')
          # -r REV specifies a commit to compare with the worktree
          #
          # Let darker's exit code decide: it is 0 when there is nothing to
          # report, and non-zero both for findings and for crashes (bad
          # revision, missing linter, …). Do not capture the output — darker
          # writes crash details to stderr, so capturing stdout and testing it
          # for emptiness makes every crash look like a pass.
          #
          # `--diff` makes darker PRINT the reformatting/isort patch it wants.
          # Without it, `--check` signals findings through the exit code alone
          # and prints nothing, so a formatting failure shows up as a blank red
          # X with no explanation. `--diff` does not change the exit code; it
          # just reveals what `format-python.sh origin/main` would fix.
          darker --check --diff --isort -L "flake8 --max-line-length=88 --extend-ignore=F821" kpi kobo hub -r $LATEST_IN_BASE_BRANCH
        # `bash` (not a bare `/usr/bin/bash`) so the step keeps `-e -o pipefail`
        # and aborts on the first failing command.
        shell: bash
