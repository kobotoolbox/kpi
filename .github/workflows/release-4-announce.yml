name: 'CD: announce'


# Design doc: "When minor or patch release is in 'Pending Release' status:
# 1. (manually by Release Manager) run a GHA action that does the following steps"
#
# Pipeline: validate tag → generate changelog → [kpi, kobo-docker, kobo-install] → linear → notify
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to announce (e.g. 2.026.27a)'
        required: true
        type: string


jobs:

  # Validate that the tag actually exists and derive the release branch from it.
  current-branch:
    runs-on: ubuntu-24.04
    outputs:
      current_branch: ${{ steps.branch.outputs.current_branch }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Validate tag and derive release branch
      id: branch
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -xe
        if ! git rev-parse "refs/tags/$TAG" &>/dev/null; then
          echo "::error::Tag '$TAG' does not exist."
          exit 1
        fi
        MINOR=$(echo "$TAG" | grep -oP '^\d+\.\d+\.\d+')
        echo "current_branch=release/$MINOR" >> "$GITHUB_OUTPUT"


  version:
    needs:
      - current-branch
    secrets: inherit
    uses: './.github/workflows/find-releases.yml'
    with:
      current_branch: ${{ needs.current-branch.outputs.current_branch }}


  # Design doc step 2: "create GitHub releases with a changelog"
  #
  # Generate changelog using git-cliff (same tool used in release-2-stabilize.yml).
  changelog:
    runs-on: ubuntu-24.04
    needs:
      - version
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Generate changelog for this release
      id: changelog
      env:
        VERSION: ${{ inputs.tag }}
      run: |
        BODY=$(npx git-cliff@2.10.0 -u --tag "$VERSION")
        {
          echo 'body<<EOF'
          echo "${BODY}"
          echo EOF
        } >> "$GITHUB_OUTPUT"


  # Create the primary GitHub release on kpi with the full changelog body.
  kpi:
    runs-on: ubuntu-24.04
    needs:
      - version
      - changelog
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Create GitHub release for kpi
      env:
        VERSION: ${{ inputs.tag }}
        BODY: ${{ needs.changelog.outputs.body }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$VERSION" \
          --title "$VERSION" \
          --notes "$BODY" \
          --verify-tag


  # Create a GitHub release on kobo-docker that links back to the kpi release.
  kobo-docker:
    runs-on: ubuntu-24.04
    needs:
      - version
      - changelog
    steps:
    - name: Generate cross-repo token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.KOBO_BOT_APP_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
        owner: kobotoolbox
        repositories: "kobo-docker"

    - name: Create GitHub release for kobo-docker
      env:
        VERSION: ${{ inputs.tag }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        KPI_RELEASE_URL="https://github.com/kobotoolbox/kpi/releases/tag/${VERSION}"
        gh release create "$VERSION" \
          --repo kobotoolbox/kobo-docker \
          --title "$VERSION" \
          --notes "For more information, please see ${KPI_RELEASE_URL}" \
          --verify-tag


  # Create a GitHub release on kobo-install that links back to the kpi release.
  kobo-install:
    runs-on: ubuntu-24.04
    needs:
      - version
      - changelog
    steps:
    - name: Generate cross-repo token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.KOBO_BOT_APP_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
        owner: kobotoolbox
        repositories: "kobo-install"

    - name: Create GitHub release for kobo-install
      env:
        VERSION: ${{ inputs.tag }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        KPI_RELEASE_URL="https://github.com/kobotoolbox/kpi/releases/tag/${VERSION}"
        gh release create "$VERSION" \
          --repo kobotoolbox/kobo-install \
          --title "$VERSION" \
          --notes "For more information, please see ${KPI_RELEASE_URL}" \
          --verify-tag


  # Design doc step 3: "set Linear release status to 'Released'"
  linear:
    runs-on: ubuntu-24.04
    needs:
      - version
      - kpi
      - kobo-docker
      - kobo-install
    if: ${{ !cancelled() && !failure() }}
    steps:
    - name: Set Linear release status to "Released"
      env:
        VERSION: ${{ inputs.tag }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY_GITHUB_ACTIONS_BOT }}
      run: |
        echo "::notice::TODO: set Linear release status to 'Released' for $VERSION"
        echo "Requires Linear GraphQL API integration (see workflow comments)"
        # TODO: Implement Linear GraphQL API integration.
        # Requirements:
        #   - Find the Linear project release by name matching $VERSION
        #   - Update its status to "Released"
        # Linear GraphQL endpoint: https://api.linear.app/graphql
        # Relevant mutations: updateProjectUpdate, or project status field update


  # Design doc step 4: "notify on zulip"
  notify:
    needs:
      - version
      - kpi
      - kobo-docker
      - kobo-install
      - linear
    if: ${{ !cancelled() && !failure() }}
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":rocket: `${{ inputs.tag }}` GitHub releases published for kpi, kobo-docker, and kobo-install."


  on-failure:
    needs:
      - version
      - changelog
      - kpi
      - kobo-docker
      - kobo-install
    if: ${{ !cancelled() && failure() }}
    secrets: inherit
    uses: './.github/workflows/zulip.yml'
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":warning: [run #${{github.run_number}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}) failed to create GitHub release(s) for `${{ inputs.tag }}`."
