name: 'CD: publish'


# Pipeline: validate tag → fetch changelog → [kpi, kobo-docker, kobo-install] → linear → notify
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to announce (e.g. 2.026.27a)'
        required: true
        type: string


permissions:
  contents: read


jobs:

  resolve-actor:
    uses: './.github/workflows/resolve-actor.yml'

  # Resolve the tag (selected in the 'Use workflow from' dropdown, or passed by
  # the tag workflow) and its release branch.
  current-branch:
    runs-on: ubuntu-24.04
    outputs:
      current_branch: ${{ steps.branch.outputs.current_branch }}
      tag: ${{ steps.branch.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Validate selected tag
      id: branch
      env:
        INPUT_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -xe
        TAG="$INPUT_TAG"
        if [[ -z "$TAG" ]]; then
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::This workflow must be run from a release tag (e.g. 2.026.27a). You selected branch '$REF_NAME'. Please re-run and pick the tag in the 'Use workflow from' dropdown."
            exit 1
          fi
          TAG="$REF_NAME"
        fi
        if ! git rev-parse "refs/tags/$TAG" &>/dev/null; then
          echo "::error::Tag '$TAG' does not exist."
          exit 1
        fi
        MINOR=$(echo "$TAG" | grep -oP '^\d+\.\d+\.\d+')
        echo "current_branch=release/$MINOR" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"


  version:
    needs:
      - current-branch
    uses: './.github/workflows/find-releases.yml'
    with:
      current_branch: ${{ needs.current-branch.outputs.current_branch }}


  # Fetch changelog from the dedicated branch. The tag workflow generates it,
  # but a human may have edited it since (to fix mistakes, reword entries, etc.)
  # — that's expected and the edited version takes precedence.
  changelog:
    runs-on: ubuntu-24.04
    needs:
      - current-branch
      - version
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch changelog from branch
      id: changelog
      env:
        VERSION: ${{ needs.current-branch.outputs.tag }}
      run: |
        CHANGELOG_BRANCH="changelog/$VERSION"
        if ! git ls-remote --exit-code origin "refs/heads/$CHANGELOG_BRANCH" >/dev/null 2>&1; then
          echo "::error::Changelog branch '$CHANGELOG_BRANCH' not found. The tag workflow should have created it."
          exit 1
        fi

        BODY=$(git show "origin/$CHANGELOG_BRANCH:CHANGELOG.md")

        {
          echo 'body<<EOF'
          echo "${BODY}"
          echo EOF
        } >> "$GITHUB_OUTPUT"


  # Create GitHub Release on kpi with the full changelog body.
  github-release-kpi:
    runs-on: ubuntu-24.04
    needs:
      - current-branch
      - version
      - changelog
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Create GitHub release for kpi
      env:
        VERSION: ${{ needs.current-branch.outputs.tag }}
        BODY: ${{ needs.changelog.outputs.body }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$VERSION" &>/dev/null; then
          echo "::notice::Release $VERSION already exists on kpi. Skipping."
        else
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$BODY" \
            --verify-tag
        fi


  # Create GitHub Release on kobo-docker that links back to the kpi release.
  github-release-kobo-docker:
    runs-on: ubuntu-24.04
    needs:
      - current-branch
      - version
      - changelog
    steps:
    - name: Generate cross-repo token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.KOBO_BOT_CLIENT_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
        owner: kobotoolbox
        repositories: "kobo-docker"

    - name: Create GitHub release for kobo-docker
      env:
        VERSION: ${{ needs.current-branch.outputs.tag }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if gh release view "$VERSION" --repo kobotoolbox/kobo-docker &>/dev/null; then
          echo "::notice::Release $VERSION already exists on kobo-docker. Skipping."
        else
          KPI_RELEASE_URL="https://github.com/kobotoolbox/kpi/releases/tag/${VERSION}"
          gh release create "$VERSION" \
            --repo kobotoolbox/kobo-docker \
            --title "$VERSION" \
            --notes "For more information, please see ${KPI_RELEASE_URL}" \
            --verify-tag
        fi


  # Create GitHub Release on kobo-install that links back to the kpi release.
  github-release-kobo-install:
    runs-on: ubuntu-24.04
    needs:
      - current-branch
      - version
      - changelog
    steps:
    - name: Generate cross-repo token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.KOBO_BOT_CLIENT_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
        owner: kobotoolbox
        repositories: "kobo-install"

    - name: Create GitHub release for kobo-install
      env:
        VERSION: ${{ needs.current-branch.outputs.tag }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if gh release view "$VERSION" --repo kobotoolbox/kobo-install &>/dev/null; then
          echo "::notice::Release $VERSION already exists on kobo-install. Skipping."
        else
          KPI_RELEASE_URL="https://github.com/kobotoolbox/kpi/releases/tag/${VERSION}"
          gh release create "$VERSION" \
            --repo kobotoolbox/kobo-install \
            --title "$VERSION" \
            --notes "For more information, please see ${KPI_RELEASE_URL}" \
            --verify-tag
        fi


  # Set Linear release status to 'Released'
  linear:
    runs-on: ubuntu-24.04
    needs:
      - current-branch
      - version
      - github-release-kpi
      - github-release-kobo-docker
      - github-release-kobo-install
    if: ${{ !cancelled() && !failure() }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v.0.17.2
      with:
        access_key: ${{ secrets.LINEAR_PIPELINE_KEY_KPI }}
        command: complete
        release_version: ${{ needs.current-branch.outputs.tag }}


  notify:
    needs:
      - current-branch
      - version
      - github-release-kpi
      - github-release-kobo-docker
      - github-release-kobo-install
      - linear
    if: ${{ !cancelled() && !failure() }}
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":rocket: `${{ needs.current-branch.outputs.tag }}` GitHub releases published for [kpi](https://github.com/kobotoolbox/kpi/releases/tag/${{ inputs.tag }}), kobo-docker, and kobo-install. @*support*"


  on-failure:
    needs:
      - current-branch
      - resolve-actor
      - version
      - changelog
      - github-release-kpi
      - github-release-kobo-docker
      - github-release-kobo-install
      - linear
    if: ${{ !cancelled() && (needs.version.result == 'failure' || needs.changelog.result == 'failure' || needs.github-release-kpi.result == 'failure' || needs.github-release-kobo-docker.result == 'failure' || needs.github-release-kobo-install.result == 'failure' || needs.linear.result == 'failure') }}
    secrets: inherit
    uses: './.github/workflows/zulip.yml'
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":warning: [run #${{github.run_number}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}) failed to announce `${{ needs.current-branch.outputs.tag }}`. ${{ needs.resolve-actor.outputs.mention || '@*devs*' }} please investigate."
