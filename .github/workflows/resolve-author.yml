name: Resolve commit author to Zulip mention

on:
  workflow_call:
    outputs:
      mention:
        description: 'Zulip @**Name** mention for the commit author, empty if not found'
        value: ${{ jobs.resolve.outputs.mention }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      mention: ${{ steps.resolve.outputs.mention }}
    steps:
      - name: Resolve commit author to Zulip mention
        id: resolve
        env:
          MAP: ${{ vars.ZULIP_USERNAME_MAP }}
          AUTHOR: ${{ github.event.head_commit.author.username || github.actor }}
        run: |
          ZULIP_NAME=""
          if [[ -n "$MAP" ]]; then
            ZULIP_NAME=$(echo "$MAP" | jq -r --arg user "$AUTHOR" '.[$user] // empty' 2>/dev/null || true)
          fi
          if [[ -n "$ZULIP_NAME" ]]; then
            echo "mention=@**${ZULIP_NAME}**" >> "$GITHUB_OUTPUT"
          fi
