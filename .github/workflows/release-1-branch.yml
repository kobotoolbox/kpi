name: 'CD: branch'


concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
  schedule:
    # It's good to deploy early in week:
    # - In the best case, will QA, tag and deploy on the same Tuesday or Wednesday.
    # - In an ok case, will QA, tag and deploy on the next Monday-Wednesday.
    # - In the worst case, the last chance is to deploy on after-next Monday.
    - cron: '17 5 * * 3'


jobs:


  current-branch:
    runs-on: ubuntu-24.04
    outputs:
      current_branch: ${{ steps.branch.outputs.current_branch }}
    steps:
    - name: determine current release branch name
      id: branch
      run: |
        set -xe
        NEW_VERSION="2.$(date +"%Y" | tail -c4).$(date +"%V")"
        NEW_BRANCH="release/$NEW_VERSION"
        echo "current_branch=${NEW_BRANCH}" >> $GITHUB_OUTPUT


  version:
    needs:
      - current-branch
    secrets: inherit
    uses: './.github/workflows/find-releases.yml'
    with:
      current_branch: ${{ needs.current-branch.outputs.current_branch }}


  create-current-branch:
    needs:
      - version
    if: ${{ needs.version.outputs.prev_released == 'true' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/checkout-with-github-app-token
      with:
        client-id: ${{ secrets.KOBO_BOT_CLIENT_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
    - name: create next RC branch
      id: branch
      env:
        NEW_BRANCH: ${{ needs.version.outputs.current_branch }}
      run: |
        set -xe
        git checkout -b $NEW_BRANCH
        git push origin $NEW_BRANCH


  # Create Linear release and link issues from commits unique to this branch.
  # Uses prev branch tip (not prev tag) so commits to be released as patches on
  # the previous minor are excluded.
  linear:
    needs:
      - version
      - create-current-branch
    runs-on: ubuntu-24.04
    outputs:
      release_url: ${{ steps.create.outputs.release-url }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v.0.15.1
      id: create
      with:
        access_key: ${{ secrets.LINEAR_PIPELINE_KEY_KPI }}
        release_version: ${{ needs.version.outputs.current_minor }}
        base_ref: origin/${{ needs.version.outputs.prev_branch }}
    - uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v.0.15.1
      with:
        access_key: ${{ secrets.LINEAR_PIPELINE_KEY_KPI }}
        command: update
        release_version: ${{ needs.version.outputs.current_minor }}
        stage: "Pending QA"


  qa-issue:
    needs:
      - version
      - create-current-branch
      - linear
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.version.outputs.current_branch }}

    - name: Fetch QA template from Linear
      id: template
      uses: ./.github/actions/fetch-linear-issue
      with:
        linear-api-key: ${{ secrets.LINEAR_API_KEY_GITHUB_ACTIONS_BOT }}
        issue-id: 'DEV-2637'

    - name: Build issue description
      id: body
      env:
        CURRENT_PATCH: ${{ needs.version.outputs.current_patch }}
        CURRENT_BRANCH: ${{ needs.version.outputs.current_branch }}
        RELEASE_URL: ${{ needs.linear.outputs.release_url }}
        TEMPLATE: ${{ steps.template.outputs.body }}
      run: |
        BODY="${TEMPLATE//\$CURRENT_PATCH/$CURRENT_PATCH}"
        BODY="${BODY//\$CURRENT_BRANCH/$CURRENT_BRANCH}"
        BODY="${BODY//\$RELEASE_URL/$RELEASE_URL}"

        {
          echo "body<<EOF"
          echo "${BODY}EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upsert Linear QA issue
      uses: ./.github/actions/upsert-linear-issue
      with:
        linear-api-key: ${{ secrets.LINEAR_API_KEY_GITHUB_ACTIONS_BOT }}
        title: "QA kpi ${{ needs.version.outputs.current_minor }}"
        description: ${{ steps.body.outputs.body }}
        team-id: 'ea750a9d-5a92-4fe2-a494-55fa114ba0dd'
        state-id: 'f5f82c75-1cd0-4792-b233-c31f51fdc0d0'  # In QA


  notify-current:
    needs:
      - version
      - linear
      - qa-issue
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: |
        :seedling: `${{ needs.version.outputs.current_branch }}` branch created! Checklist:
        - @*QA* & @*product*: the release window is as long as it takes to tag the release version. If you want to "scrap" this release then ask devs to manually delete the branch.


  notify-prev:
    needs:
      - version
      - create-current-branch
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.prev_minor }} release"
      content: |
        ${{ needs.version.outputs.prev_released == 'false'
          && format(':repeat: current release is not tagged yet, therefore lets skip the next release "{0}"', needs.version.outputs.current_minor)
          || format(':race: current release is tagged, therefore lets move on to a new release branch for the next release "{0}"', needs.version.outputs.current_minor)
        }}


  on-failure:
    needs:
      - current-branch
      - version
      - create-current-branch
      - linear
      - qa-issue
      - notify-prev
      - notify-current
    if: ${{ failure() }}
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":warning: [run #${{github.run_number}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}) something went wrong."
