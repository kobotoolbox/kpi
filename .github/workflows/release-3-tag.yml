name: 'CD: tag'


concurrency:
  group: tag
  cancel-in-progress: false


# Pipeline: determine version → pull-transifex → tag → build-image → [bump, linear, deploy-to-master] → notify
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to tag (e.g. release/2.026.27). Leave empty to auto-detect the latest.'
        required: false
        type: string
      force:
        description: 'Skip branch eligibility checks (for security hotfixes on older branches).'
        required: false
        type: boolean
        default: false


jobs:

  # Determine which release branch to work on.
  # If the user provided one, use it. Otherwise, find the latest release branch.
  current-branch:
    runs-on: ubuntu-24.04
    outputs:
      current_branch: ${{ steps.branch.outputs.current_branch }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Determine release branch
      id: branch
      env:
        INPUT_BRANCH: ${{ inputs.release_branch }}
      run: |
        set -xe
        if [[ -n "$INPUT_BRANCH" ]]; then
          # Validate that the branch exists
          if ! git show-branch "origin/$INPUT_BRANCH" &>/dev/null; then
            echo "::error::Branch '$INPUT_BRANCH' does not exist."
            exit 1
          fi
          echo "current_branch=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
        else
          # Auto-detect: find the latest release branch (the one whose next is main)
          # Use the same logic as find_releases.sh but just find the latest
          LATEST=$(git branch -r --list 'origin/release/*' | sed 's|origin/||' | sort -V | tail -1 | xargs)
          if [[ -z "$LATEST" ]]; then
            echo "::error::No release branches found."
            exit 1
          fi
          echo "current_branch=$LATEST" >> "$GITHUB_OUTPUT"
        fi


  version:
    needs:
      - current-branch
    secrets: inherit
    uses: './.github/workflows/find-releases.yml'
    with:
      current_branch: ${{ needs.current-branch.outputs.current_branch }}


  # Validate that this branch is eligible for tagging:
  # - The latest minor is always allowed (next_branch == 'main')
  # - The previous minor is allowed only if the latest minor is unreleased
  # - Older branches require the `force` input
  validate:
    needs:
      - version
    if: ${{ !cancelled() && !failure() && inputs.force != true }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Check branch eligibility
      env:
        NEXT_BRANCH: ${{ needs.version.outputs.next_branch }}
        CURRENT_BRANCH: ${{ needs.version.outputs.current_branch }}
      run: |
        LATEST=$(git branch -r --list 'origin/release/*' | sed 's|origin/||' | sort -V | tail -1 | xargs)

        # Must be the latest minor or the one directly before it
        if [[ "$NEXT_BRANCH" != "main" && "$NEXT_BRANCH" != "$LATEST" ]]; then
          echo "::error::Cannot tag $CURRENT_BRANCH: only the latest ($LATEST) or the one before it are eligible. Use 'force' input for deep security hotfixes."
          exit 1
        fi

        # If not the latest, the latest must be unreleased
        if [[ "$NEXT_BRANCH" != "main" ]]; then
          LATEST_TAG=$(git tag --list --sort=-version:refname "${LATEST#release/}*" | head -1)
          LATEST_TIP=$(git rev-parse "origin/$LATEST")
          TAG_COMMIT=$(git rev-parse "${LATEST_TAG:-HEAD}^{commit}" 2>/dev/null || echo "none")
          if [[ -n "$LATEST_TAG" && "$LATEST_TIP" == "$TAG_COMMIT" ]]; then
            echo "::error::Cannot tag $CURRENT_BRANCH: the latest minor ($LATEST) is already released. Use 'force' input for deep security hotfixes."
            exit 1
          fi
        fi

        echo "::notice::Branch $CURRENT_BRANCH is eligible for tagging."


  # Pull translations and commit if changed, before tagging.
  pull-transifex:
    needs:
      - version
      - validate
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.current_branch }}
        fetch-depth: 0
        fetch-tags: true
    - uses: ./.github/actions/checkout-with-github-app-token
      with:
        app-id: ${{ secrets.KOBO_BOT_APP_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}

    - name: Pull Transifex translations
      uses: transifex/cli-action@v2
      with:
        token: ${{ secrets.TRANSIFEX_API }}
        args: 'pull -a -f --mode reviewed'

    - name: Commit translations if changed
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
        BRANCH: ${{ needs.version.outputs.current_branch }}
      run: |
        if git diff-index --quiet HEAD; then
          exit 0
        fi
        # Abort if someone pushed to the branch while translations were being pulled
        git fetch origin "$BRANCH"
        if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]]; then
          echo "::error::Unexpected commits on $BRANCH since checkout. Aborting."
          exit 1
        fi
        git add .
        git commit -m "chore: pull transifex translations for $VERSION"
        git push


  # Create and push the tag on the release branch (after any transifex commit).
  tag:
    needs:
      - version
      - pull-transifex
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.current_branch }}
        fetch-depth: 0
        fetch-tags: true
    - uses: ./.github/actions/checkout-with-github-app-token
      with:
        app-id: ${{ secrets.KOBO_BOT_APP_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}

    - name: Pull latest (in case transifex committed)
      env:
        BRANCH: ${{ needs.version.outputs.current_branch }}
      run: |
        git fetch origin "$BRANCH"
        LOCAL=$(git rev-parse HEAD)
        REMOTE=$(git rev-parse "origin/$BRANCH")
        if [[ "$LOCAL" != "$REMOTE" ]]; then
          # Only allow fast-forward (transifex commit). Abort if unrelated commits appeared.
          if ! git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            echo "::error::Unexpected commits on $BRANCH since workflow started. Aborting."
            exit 1
          fi
          git merge --ff-only "origin/$BRANCH"
        fi

    - name: Create and push tag
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
      run: |
        set -xe
        # Check if tag already exists (idempotent)
        if git rev-parse "refs/tags/$VERSION" &>/dev/null; then
          echo "::error::Tag '$VERSION' already exists. If retrying, delete it first."
          exit 1
        fi
        git tag -a "$VERSION" -m "Release $VERSION"
        git push origin "refs/tags/$VERSION"


  # Build the Docker image from the tagged commit and push to GHCR.
  build-image:
    runs-on: ubuntu-24.04
    needs:
      - version
      - tag
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write   # needed for tag deletion on failure
      packages: write   # needed for GHCR push
    env:
      CI_REGISTRY_IMAGE: ghcr.io/kobotoolbox/kpi
    steps:
    - uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ needs.version.outputs.current_patch }}
        fetch-depth: 1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
      run: |
        set -xe
        # Pull previous release branch image for cache (best-effort, speeds up builds).
        BRANCH_TAG=$(echo "${{ needs.version.outputs.current_branch }}" | tr '/' '-')
        docker pull "$CI_REGISTRY_IMAGE:$BRANCH_TAG" || true
        # Build the production image tagged with the version
        docker build \
          --cache-from "$CI_REGISTRY_IMAGE:$BRANCH_TAG" \
          --tag "$CI_REGISTRY_IMAGE:$VERSION" \
          .
        # Verify the image contains the expected commit
        EXPECTED_SHA=$(git rev-parse HEAD)
        IMAGE_SHA=$(docker run --rm "$CI_REGISTRY_IMAGE:$VERSION" bash -c \
          "cd /srv/src/kpi && git rev-parse --verify HEAD 2>/dev/null || cat .commit_sha 2>/dev/null || echo unknown")
        if [ "$IMAGE_SHA" != "unknown" ] && [ "$IMAGE_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::Image contains commit $IMAGE_SHA but expected $EXPECTED_SHA"
          exit 1
        fi
        # Push the image to GHCR
        docker push "$CI_REGISTRY_IMAGE:$VERSION"

    # On failure, delete the remote tag so the workflow can be re-run.
    - name: "Rollback: delete tag on failure"
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Uses the GitHub API because `git tag -d` only deletes locally and
      # `git push --delete` would require push credentials in this step.
      run: |
        echo "::warning::Image build failed. Deleting tag so the workflow can be re-run to retry."
        gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${{ needs.version.outputs.current_patch }}" || true


  # Bump version references in kobo-docker and kobo-install, then tag them.
  bump:
    runs-on: ubuntu-24.04
    needs:
      - version
      - build-image
    if: ${{ !cancelled() && !failure() }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/checkout-with-github-app-token
      id: app-token
      with:
        app-id: ${{ secrets.KOBO_BOT_APP_ID }}
        private-key: ${{ secrets.KOBO_BOT_PRIVATE_KEY }}
        owner: kobotoolbox
        repositories: "kobo-docker,kobo-install"

    - name: Bump KoboToolbox version in kobo-docker and tag it
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -xe
        TMPDIR=$(mktemp -d)
        git clone --depth=1 --branch=master \
          "https://x-access-token:${GH_TOKEN}@github.com/kobotoolbox/kobo-docker.git" "$TMPDIR"
        cd "$TMPDIR"

        # Update image tag in docker-compose.frontend.yml
        sed -i -E "s|(image: kobotoolbox/kpi:).*|\1${VERSION}|" docker-compose.frontend.yml

        # Commit if changed (idempotent)
        if git diff --quiet; then
          echo "No changes needed in kobo-docker (already at $VERSION)"
        else
          git add docker-compose.frontend.yml
          git commit -m "chore(deps): upgrade KPI to ${VERSION}"
          git push origin master
        fi

        # Create and push annotated tag (idempotent)
        if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
          echo "Tag ${VERSION} already exists on kobo-docker. Skipping."
        else
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
        fi

    - name: Bump KoboToolbox version in kobo-install and tag it
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -xe
        TMPDIR=$(mktemp -d)
        git clone --depth=1 --branch=master \
          "https://x-access-token:${GH_TOKEN}@github.com/kobotoolbox/kobo-install.git" "$TMPDIR"
        cd "$TMPDIR"

        # Update KOBO_DOCKER_BRANCH in helpers/config.py
        sed -i -E "s|(KOBO_DOCKER_BRANCH = ')[^']*('.*)|\\1${VERSION}\\2|" helpers/config.py

        # Commit if changed (idempotent)
        if git diff --quiet; then
          echo "No changes needed in kobo-install (already at $VERSION)"
        else
          git add helpers/config.py
          git commit -m "chore(deps): use release ${VERSION} of kobo-docker"
          git push origin master
        fi

        # Create and push annotated tag (idempotent)
        if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
          echo "Tag ${VERSION} already exists on kobo-install. Skipping."
        else
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
        fi


  # Create deployment Linear issue
  linear:
    runs-on: ubuntu-24.04
    needs:
      - version
      - build-image
    if: ${{ !cancelled() && !failure() }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.current_branch }}
        fetch-depth: 0
        fetch-tags: true

    # Final sync from prev_patch catches any unreleased commits from the prev
    # branch that were merged forward (the stabilize workflow uses branch tip
    # which excludes these).
    - uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        release_version: ${{ needs.version.outputs.current_patch }}
        base_ref: ${{ needs.version.outputs.prev_patch }}

    - uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: update
        release_version: ${{ needs.version.outputs.current_patch }}
        stage: "Pending Release (preview on kf.master)"

    # Heuristic: flag migrations that use RunPython/RunSQL as "heavy" so Infra
    # can plan downtime or run them separately from the main deploy.
    - name: Detect SKIP_HEAVY_MIGRATIONS
      id: migrations
      env:
        PREV_TAG: ${{ needs.version.outputs.prev_patch }}
        CURRENT_TAG: ${{ needs.version.outputs.current_patch }}
      run: |
        HEAVY="false"
        MIGRATION_FILES=$(git diff --name-only "$PREV_TAG"..HEAD -- '*/migrations/*.py' 2>/dev/null || true)
        if [[ -n "$MIGRATION_FILES" ]]; then
          for f in $MIGRATION_FILES; do
            if [[ -f "$f" ]] && grep -qE '(RunPython|RunSQL)' "$f" 2>/dev/null; then
              HEAVY="true"
              echo "::notice::Heavy migration detected in $f"
              break
            fi
          done
        fi
        echo "skip_heavy=$HEAVY" >> "$GITHUB_OUTPUT"

    - name: Create Linear issue for Infra to deploy
      env:
        VERSION: ${{ needs.version.outputs.current_patch }}
        SKIP_HEAVY: ${{ steps.migrations.outputs.skip_heavy }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY_GITHUB_ACTIONS_BOT }}
      run: |
        echo "::warning::TODO DEV-653: create Linear issue for Infra team to deploy $VERSION (not yet implemented)"
        echo "SKIP_HEAVY_MIGRATIONS=$SKIP_HEAVY"
        # TODO DEV-653: Implement Linear issue creation for Infra deployment.
        # Requirements:
        #   - Create issue in Infra team with deployment checklist
        #   - Include SKIP_HEAVY_MIGRATIONS=$SKIP_HEAVY in the issue body
        #   - Include per-instance deployment steps
        # Linear GraphQL mutation: issueCreate


  deploy-to-master:
    runs-on: ubuntu-24.04
    needs:
      - version
    if: ${{ !cancelled() && !failure() }}
    steps:
    - uses: actions/checkout@v6

    - name: Deploy to kf.master (placeholder)
      run: |
        echo '::warning::Automated deploy not yet implemented. Deploy manually on kf.master.kbtdev.'
        ## see https://github.com/kobotoolbox/kobo-deployments
        ## see https://chat.kobotoolbox.org/#narrow/stream/4-Kobo-Dev/topic/2.2E024.2E33.20Release/near/472818
        ## Note: script does two things - deploys and updates docker-compose - see if can seperate that for easier reruns
        ## Note: this server has lots of data, run migrations or smtg with a 1 minute timeout to flag if some migrations run too long
        # pipenv shell
        # fab update_kpi:$VERSION
        # fab dev_deploy:master,kpi,$GITHUB_REF


  notify:
    needs:
      - version
      - build-image
      - bump
      - linear
      - deploy-to-master
    if: ${{ !cancelled() && !failure() }}
    uses: './.github/workflows/zulip.yml'
    secrets: inherit
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":label: `${{ needs.version.outputs.current_patch }}` tagged, image built and pushed to GHCR. Bumped kobo-docker and kobo-install. Triggered deploy to kf.master."


  on-failure:
    needs:
      - version
      - validate
      - pull-transifex
      - tag
      - build-image
      - bump
      - linear
      - deploy-to-master
    if: ${{ !cancelled() && failure() }}
    secrets: inherit
    uses: './.github/workflows/zulip.yml'
    with:
      topic: "${{ needs.version.outputs.current_minor }} release"
      content: ":warning: [run #${{github.run_number}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}) release pipeline failed for `${{ needs.version.outputs.current_patch }}`. @*devs* please investigate."
