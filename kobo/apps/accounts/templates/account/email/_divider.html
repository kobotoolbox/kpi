{% comment %}
A horizontal rule as a bordered table cell, not `<hr>`: Outlook gives `<hr>` its
own colour and thickness whatever you style it with.
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 20px;">
  <tr>
    <td class="hr-light" style="border-top:1px solid #e6e8ee;font-size:0;line-height:0;">&nbsp;</td>
  </tr>
</table>
